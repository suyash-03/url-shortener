<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🔗 URL Shortener</h1>
      <p class="subtitle">Paste a long URL and get a short one</p>
    </header>

    <form id="shorten-form">
      <div class="input-group">
        <input
          type="url"
          id="url-input"
          placeholder="https://example.com/very/long/url..."
          required
          autocomplete="off"
        />
        <button type="submit" id="shorten-btn">Shorten</button>
      </div>
    </form>

    <div id="result" class="result hidden">
      <p>Your short URL:</p>
      <div class="short-url-row">
        <a id="short-url" href="#" target="_blank" rel="noopener"></a>
        <button id="copy-btn" class="copy-btn" title="Copy to clipboard">📋</button>
      </div>
    </div>

    <section class="urls-section">
      <h2>Recent URLs</h2>
      <table id="urls-table">
        <thead>
          <tr>
            <th>Short Code</th>
            <th>Original URL</th>
            <th>Clicks</th>
            <th>Created</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="urls-body">
        </tbody>
      </table>
      <p id="empty-state" class="empty-state">No URLs shortened yet.</p>
    </section>
  </div>

  <script src="/script.js"></script>
</body>
</html>
