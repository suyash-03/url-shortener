services:
  - type: web
    name: snip-url-shortener
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BASE_URL
        generateValue: false
    healthCheckPath: /api/urls
